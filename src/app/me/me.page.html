<ion-header>
  <ion-toolbar>
    <ion-title>My Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-scroll">
    <div class="profile-heading">
      <img class="profile-image" [src]="profile.image" [alt]="profile.name + ' profile picture'">
      <p class="eyebrow">MOVIE FAN</p>
      <h1>{{ profile.name }}</h1>
    </div>
    <ion-list inset="true">
      <ion-item>
        <ion-label><span>Name</span><strong>{{ profile.name }}</strong></ion-label>
      </ion-item>
      <ion-item>
        <ion-label><span>Username</span><strong>{{ profile.username }}</strong></ion-label>
      </ion-item>
      <ion-item>
        <ion-label><span>Email</span><strong>{{ profile.email }}</strong></ion-label>
      </ion-item>
      <ion-item>
        <ion-label><span>Address</span><strong>{{ profile.address }}</strong></ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
