<ion-header>
  <ion-toolbar>
    <ion-title>Feature Movies</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-scroll">
    <div class="page-heading">
      <p class="eyebrow">CURATED FOR YOU</p>
      <h1>Feature Movies</h1>
    </div>
    @for (movie of movies; track movie.id) {
      <ion-card class="movie-card" [routerLink]="['/movie-detail', movie.id]">
        <img [src]="movie.banner" [alt]="movie.title + ' banner'">
        <ion-card-header>
          <ion-card-title>{{ movie.title }}</ion-card-title>
          <ion-card-subtitle>{{ movie.genre }}</ion-card-subtitle>
        </ion-card-header>
      </ion-card>
    }
  </div>
</ion-content>
